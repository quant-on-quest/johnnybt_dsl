# Build the wheels people install, then publish them.
#
# Six cells: linux / macOS / Windows × x86_64 / arm64. This crate compiles C
# — mruby's whole source, plus our macro trampolines — so every cell builds
# on a machine of its own architecture and nothing is cross-compiled. That is
# not fastidiousness: mruby's build runs `mrbc`, a tool it just built, to turn
# our gems' Ruby into C, and a cross-compiled `mrbc` does not run on the
# builder. Native means one build instead of two, on every platform.
#
# The extension is abi3 for Python 3.11, so one wheel per platform covers
# 3.11 through 3.14 — the matrix is about machines, not interpreters. What
# ships is one static archive inside the module: **installing needs neither
# Ruby nor a C compiler**, which is the whole point of publishing wheels.
#
# Publishing uses PyPI's trusted publishing (OIDC) — no token lives here.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The manylinux images this action picks for aarch64 by default are
          # *cross* images (x86_64 hosts carrying a cross gcc), which is the
          # one thing mruby cannot use. Naming pypa's own native images
          # instead keeps both linux cells native — and gives the wheels a
          # real manylinux tag, which a build on the runner's own glibc
          # would not have.
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - { os: macos, arch: x86_64, runner: macos-15-intel, target: x86_64 }
          - { os: macos, arch: arm64, runner: macos-latest, target: aarch64 }
          - { os: windows, arch: x86_64, runner: windows-latest, target: x64 }
          - { os: windows, arch: arm64, runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v6

      # mruby's build is driven by its own rake, so a Ruby has to be here.
      # It is build-time only — nothing about it ends up in the wheel.
      # 3.4 rather than 3.3 because that is the oldest one built for every
      # runner here — Windows on arm has 3.4 upwards and nothing before it.
      - uses: ruby/setup-ruby@v1
        if: matrix.os != 'linux'
        with:
          ruby-version: "3.4"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          container: ${{ matrix.container || 'off' }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # Inside the container: a Ruby new enough to run mruby's rake, and
          # rake itself — mruby's bundled `minirake` is now two lines that
          # exec the real one. AlmaLinux's default stream is Ruby 2.5, old
          # enough that mruby's own build scripts use syntax it lacks.
          before-script-linux: |
            dnf module -y reset ruby || true
            dnf module -y enable ruby:3.3 || dnf module -y enable ruby:3.1 || true
            dnf install -y ruby rubygem-rake git || yum install -y ruby rubygem-rake git
            command -v rake || gem install --no-document rake
            ruby --version && rake --version

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # One source distribution as well: someone on a platform the matrix does not
  # cover, or who wants to read what they are installing, can build it. maturin
  # carries the account walk into the tarball and rewrites the path, so a
  # source build needs no sibling checkout — verified by building it in
  # isolation.
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke:
    name: install a wheel and run some Ruby
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, artifact: wheels-linux-x86_64 }
          - { runner: macos-latest, artifact: wheels-macos-arm64 }
          - { runner: windows-latest, artifact: wheels-windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v7
        with: { name: "${{ matrix.artifact }}", path: dist }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: install
        shell: bash
        run: python -m pip install --find-links dist johnnybt-dsl
      # Not just "does it import": the machine has to have the language in
      # it. A wheel once shipped an mruby whose core had no `Regexp`, and
      # importing it was perfectly happy — the words only failed later, in
      # somebody's strategy file.
      - name: run
        shell: bash
        run: |
          python - <<'PY'
          from johnnybt_dsl import run
          source = "CHECK = [Regexp, Struct, Time, Math, Enumerable].map(&:to_s).join(' ')"
          print(run([(source, "smoke.rb")], answer="CHECK"))
          PY

  publish:
    name: publish to PyPI
    needs: [wheels, sdist, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
