[package]
name = "johnnybt_dsl"
version = "0.1.0"
edition = "2021"
description = "The DSL engine: mruby embedded in Rust, a strategy in, one JSON IR out."

[lib]
name = "johnnybt_dsl"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
